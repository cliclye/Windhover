<!DOCTYPE html>

    <meta charset="UTF-8" />

    <title>Windhover</title>
    <link rel="icon" type="image/png" href="./windhover-icon.png" />
    <meta name="description" content="Windhover — fast local LLM runtime" />
    <meta name="apple-mobile-web-app-title" content="Windhover" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /* Background only (avoids a white flash); text colour comes from styles.css tokens. */
      html, body, #root { height: 100%; margin: 0; }
      html { background: #f6f5f1; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #131312; } }
      html[data-theme="dark"] { background: #131312; }
    </style>
    <script>
      try {
        var t = localStorage.getItem("wh.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-CybqYAHn.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CyLKjWuo.css">

  </body>
