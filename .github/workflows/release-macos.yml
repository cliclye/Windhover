# Build an Apple Silicon Windhover .dmg and attach it to a GitHub Release.
#
# Trigger: push a version tag (v0.1.0) or run manually from Actions.
# Asset name is stable so website / README can use:
#   https://github.com/cliclye/Windhover/releases/latest/download/Windhover-macOS-arm64.dmg
#
# Signing / notarization: intentionally omitted. Without Apple Developer
# secrets this ships an *unsigned* DMG — users must bypass Gatekeeper once
# (see docs/DOWNLOAD.md). Add APPLE_* secrets later to enable signing.
#
# Parity with Windows release: build windhover-engine + windhover-server
# sidecars and ship them via Tauri externalBin (previously Mac DMGs shipped
# the UI shell only — chat/Library then had no engine).

name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to upload into (e.g. v0.4.3)"
        required: true
        default: "v0.4.3"

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: mac-aarch64

      - name: Install libomp (engine OpenMP)
        run: brew install libomp

      - name: Build windhover-engine
        run: |
          set -euo pipefail
          make -C engine -j"$(sysctl -n hw.ncpu)" ARCH=native
          test -f engine/windhover-engine
          ls -lh engine/windhover-engine
          otool -L engine/windhover-engine

      - name: Engine oracle smoke
        run: make -C engine test-oracle ARCH=native

      - name: Install app frontend deps + build
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Build windhover-server sidecar
        run: |
          set -euo pipefail
          bash packaging/build_sidecar.sh aarch64-apple-darwin
          test -f desktop/src-tauri/binaries/windhover-server-aarch64-apple-darwin
          test -f desktop/src-tauri/binaries/windhover-engine-aarch64-apple-darwin
          # Engine must not depend on Homebrew paths after sidecar staging.
          otool -L desktop/src-tauri/binaries/windhover-engine-aarch64-apple-darwin \
            | tee /tmp/wh-engine-otool.txt
          if grep -q '/opt/homebrew\|/usr/local/opt/libomp' /tmp/wh-engine-otool.txt; then
            echo "ERROR: engine still linked against Homebrew libomp" >&2
            exit 1
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Windhover .app
        working-directory: desktop
        # Unsigned Developer ID — we ad-hoc codesign next so Gatekeeper does not
        # report the misleading "damaged and can't be opened" error.
        run: cargo tauri build --bundles app --target aarch64-apple-darwin

      - name: Bundle libomp + ad-hoc codesign
        run: |
          set -euo pipefail
          APP="$(find desktop/src-tauri/target -path '*/release/bundle/macos/*.app' -type d | head -n 1)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "No .app found under desktop/src-tauri/target" >&2
            find desktop/src-tauri/target -type d -name '*.app' 2>/dev/null || true
            exit 1
          fi
          MACOS="$APP/Contents/MacOS"
          echo "App: $APP"
          ls -la "$MACOS"

          # Ensure OpenMP dylib sits beside the engine (users without Homebrew).
          if [ -f desktop/src-tauri/binaries/libomp.dylib ]; then
            cp -f desktop/src-tauri/binaries/libomp.dylib "$MACOS/libomp.dylib"
          fi
          ENG="$(find "$MACOS" -maxdepth 1 -type f -name 'windhover-engine*' | head -n 1)"
          if [ -z "$ENG" ]; then
            echo "ERROR: windhover-engine missing from .app (externalBin not packaged)" >&2
            exit 1
          fi
          SRV="$(find "$MACOS" -maxdepth 1 -type f -name 'windhover-server*' | head -n 1)"
          if [ -z "$SRV" ]; then
            echo "ERROR: windhover-server missing from .app (externalBin not packaged)" >&2
            exit 1
          fi
          # Clear quarantine attrs that break first launch / child exec.
          xattr -cr "$APP" || true

          echo "Signing: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/windhover-codesign.txt
          grep -q 'Sealed Resources version=' /tmp/windhover-codesign.txt
          echo "Ad-hoc codesign OK"

      - name: Package signed .app into DMG
        run: |
          set -euo pipefail
          APP="$(find desktop/src-tauri/target -path '*/release/bundle/macos/*.app' -type d | head -n 1)"
          test -d "$APP"
          mkdir -p dist
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/Windhover.app"
          ln -s /Applications "$STAGE/Applications"
          xattr -cr "$STAGE/Windhover.app" || true
          codesign --force --deep --sign - "$STAGE/Windhover.app"
          codesign --verify --deep --strict "$STAGE/Windhover.app"
          RM_DMG=dist/Windhover-macOS-arm64.dmg
          rm -f "$RM_DMG"
          hdiutil create \
            -volname "Windhover" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$RM_DMG"
          rm -rf "$STAGE"
          ls -lh "$RM_DMG"
          hdiutil verify "$RM_DMG"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windhover-macOS-arm64
          path: dist/Windhover-macOS-arm64.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/Windhover-macOS-arm64.dmg
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
          body: |
            ## Windhover

            See [CHANGELOG.md](https://github.com/cliclye/Windhover/blob/main/CHANGELOG.md).

            ## Download

            ### macOS
            **[Windhover-macOS-arm64.dmg](https://github.com/cliclye/Windhover/releases/latest/download/Windhover-macOS-arm64.dmg)** — Apple Silicon · macOS 12+

            ### Windows 11
            **[Windhover-Windows-x64.exe](https://github.com/cliclye/Windhover/releases/latest/download/Windhover-Windows-x64.exe)** — Intel/AMD 64-bit
            **[Windhover-Windows-arm64.exe](https://github.com/cliclye/Windhover/releases/latest/download/Windhover-Windows-arm64.exe)** — Snapdragon / ARM64

            ### First launch
            - **macOS:** if Gatekeeper says the app is **“damaged”**, run `xattr -cr /Applications/Windhover.app` (not a corrupt download — see [docs/DOWNLOAD.md](https://github.com/cliclye/Windhover/docs/DOWNLOAD.md))
            - **Windows:** unsigned — SmartScreen may require More info → Run anyway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
