<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Windhover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c19"/><stop offset="1" stop-color="#080b0a"/>
    </linearGradient>
    <linearGradient id="wl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c999"/><stop offset="1" stop-color="#cf955c"/>
